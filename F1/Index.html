<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webpage with Gallery & FIA Driver Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <style>
        *, *::before, *::after { 
            box-sizing: border-box; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            font-family: 'Roboto Mono', monospace;
            width: 100%;
        }

        /* Full-Width Image Container Styles */
        .image-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Data Viz Section Container */
        .viz-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px;
            background: #ffffff;
            width: 100%;
            overflow-x: auto;
        }

        /* Animation Keyframes */
        @keyframes fallIn {
            0%   { transform: translateY(-110vh); opacity: 0; }
            60%  { opacity: 1; }
            80%  { transform: translateY(8px); }
            92%  { transform: translateY(-4px); }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Viz Layout Styles */
        .scene { 
            display: flex; 
            align-items: flex-start; 
            gap: 60px; 
        }

        .viz { 
            position: relative; 
        }

        .annotation-top {
            position: absolute;
            top: -48px;
            left: 0;
            font-size: 11px;
            color: #222;
            letter-spacing: .02em;
        }
        .annotation-top .line { width:1px; height:16px; background:#222; margin:4px 0 0 10px; }
        .annotation-top .arrow-down {
            width:0; height:0;
            border-left:4px solid transparent;
            border-right:4px solid transparent;
            border-top:6px solid #222;
            margin-left:7px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(20, 22px);
            grid-template-rows: repeat(15, 22px);
            gap: 8px;
        }

        .dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            animation: fallIn .7s cubic-bezier(.22,1,.36,1) forwards;
            transition: background-color .15s ease, transform .15s ease, opacity .2s ease;
        }
        .dot.grey   { background: #8C8C8C; }
        .dot.red    { background: #C0392B; }
        .dot.yellow { background: #D4A017; }

        .dot:hover { transform: scale(1.18); }
        .dot.grey:hover   { background: #6B6B6B; }
        .dot.red:hover    { background: #E74C3C; }
        .dot.yellow:hover { background: #F4C430; }

        /* Dim non-hovered types */
        .grid.highlight-grey   .dot.red,
        .grid.highlight-grey   .dot.yellow { opacity: .18 !important; }
        .grid.highlight-red    .dot.grey,
        .grid.highlight-red    .dot.yellow { opacity: .18 !important; }
        .grid.highlight-yellow .dot.grey,
        .grid.highlight-yellow .dot.red   { opacity: .18 !important; }

        .annot-bottom {
            position: absolute;
            bottom: -54px;
            font-size: 11px;
            color: #222;
            letter-spacing: .02em;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .arrow-up {
            width:0; height:0;
            border-left:4px solid transparent;
            border-right:4px solid transparent;
            border-bottom:6px solid #222;
            margin-bottom:4px;
        }
        .annot-line { width:1px; height:14px; background:#222; margin-bottom:4px; }

        .meta {
            position: absolute;
            bottom: -96px;
            left: 0;
            font-size: 10px;
            color: #555;
            letter-spacing: .02em;
            line-height: 1.8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .meta-dot {
            width:14px; height:14px;
            border-radius:50%;
            background:#8C8C8C;
            flex-shrink:0;
        }

        /* Legend */
        .legend { display:flex; flex-direction:column; gap:24px; padding-top:40px; min-width:200px; }
        .legend-item {
            display:flex; align-items:flex-start; gap:12px; cursor:default;
        }
        .legend-dot {
            width:16px; height:16px; border-radius:50%; flex-shrink:0; margin-top:2px;
            transition: background-color .15s ease;
        }
        .legend-label { font-size:11px; color:#222; line-height:1.5; letter-spacing:.02em; }

        /* Tooltip */
        #tooltip {
            position: fixed;
            background: #111;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'Roboto Mono', monospace;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
            letter-spacing: .02em;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
            display: none;
        }
    </style>
</head>
<body>

    <!-- SECTION 1: Top Images (1 to 4) -->
    <div class="image-container">
        <img src="One.png" alt="One">
        <img src="Two.png" alt="Two">
        <img src="Three.png" alt="Three">
        <img src="Four.png" alt="Four">
    </div>

    <!-- SECTION 2: FIA Data Visualization -->
    <div class="viz-section">
        <div id="tooltip"></div>

        <div class="scene">
            <div class="viz">
                <div class="annotation-top">
                    78,720 Drivers
                    <div class="line"></div>
                    <div class="arrow-down"></div>
                </div>

                <div class="grid" id="dotGrid"></div>

                <div class="annot-bottom" style="left:300px">
                    <div class="arrow-up"></div>
                    <div class="annot-line"></div>
                    1,120 Drivers
                </div>

                <div class="annot-bottom" style="left:573px">
                    <div class="arrow-up"></div>
                    <div class="annot-line"></div>
                    36 Drivers
                </div>

                <div class="meta">
                    <div class="meta-dot"></div>
                    <div>
                        <div>1 Dot= 267 Drivers</div>
                        <div>80K Drivers</div>
                    </div>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item" data-type="grey">
                    <div class="legend-dot" style="background:#8C8C8C"></div>
                    <div class="legend-label">Drop out drivers</div>
                </div>
                <div class="legend-item" data-type="red">
                    <div class="legend-dot" style="background:#C0392B"></div>
                    <div class="legend-label">FIA International Ranked Drivers</div>
                </div>
                <div class="legend-item" data-type="yellow">
                    <div class="legend-dot" style="background:#D4A017"></div>
                    <div class="legend-label">The FIA World Championship Final Grid</div>
                </div>
            </div>
        </div>
    </div>

    <!-- SECTION 3: Bottom Images (5, 6, 7, & 8) -->
    <div class="image-container">
        <img src="Five.png" alt="Five">
        <img src="Six.png" alt="Six">
        <img src="Seven.png" alt="Seven">
        <img src="Eight.png" alt="Eight">
    </div>

    <!-- Visualization Script -->
    <script>
        const COLS = 20, ROWS = 15;
        const LABEL = {
            grey:   'Drop out drivers',
            red:    'FIA International Ranked Drivers',
            yellow: 'The FIA World Championship Final Grid',
        };
        const HOVER_COLOR = { grey:'#6B6B6B', red:'#E74C3C', yellow:'#F4C430' };
        const BASE_COLOR  = { grey:'#8C8C8C', red:'#C0392B', yellow:'#D4A017' };

        const grid = document.getElementById('dotGrid');
        const tooltip = document.getElementById('tooltip');

        for (let row = 0; row < ROWS; row++) {
            for (let col = 0; col < COLS; col++) {
                let type = 'grey';
                if (row === ROWS-1 && col >= 9 && col <= 12) type = 'red';
                else if (row === ROWS-1 && col === 19) type = 'yellow';

                const delay = row * 0.06 + col * 0.015 + Math.random() * 0.04;
                const dot = document.createElement('div');
                dot.className = `dot ${type}`;
                dot.style.animationDelay = `${delay.toFixed(3)}s`;
                dot.dataset.type = type;
                grid.appendChild(dot);
            }
        }

        // Tooltip tracking
        document.addEventListener('mousemove', (e) => {
            tooltip.style.left = (e.clientX + 14) + 'px';
            tooltip.style.top  = (e.clientY - 36) + 'px';
        });

        function showTooltip(type) {
            tooltip.textContent = LABEL[type];
            tooltip.style.display = 'block';
            grid.className = `grid highlight-${type}`;
        }
        function hideTooltip() {
            tooltip.style.display = 'none';
            grid.className = 'grid';
        }

        // Dot hover
        grid.addEventListener('mouseover', (e) => {
            const dot = e.target.closest('.dot');
            if (dot) showTooltip(dot.dataset.type);
        });
        grid.addEventListener('mouseout', (e) => {
            if (!e.relatedTarget?.closest('.dot')) hideTooltip();
        });

        // Legend hover
        document.querySelectorAll('.legend-item').forEach(item => {
            const type = item.dataset.type;
            const ldot = item.querySelector('.legend-dot');
            item.addEventListener('mouseenter', () => {
                showTooltip(type);
                ldot.style.background = HOVER_COLOR[type];
            });
            item.addEventListener('mouseleave', () => {
                hideTooltip();
                ldot.style.background = BASE_COLOR[type];
            });
        });
    </script>
</body>
</html>
