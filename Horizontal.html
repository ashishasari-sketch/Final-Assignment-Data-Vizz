<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F2 Drivers Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts for modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="horizontal-container">
    
    <!-- Card 1 -->
    <article class="stat-card">
      <div class="card-header">
        <span class="badge">F2 Championship</span>
      </div>
      <div class="stat-group">
        <span class="stat-label">Total drivers</span>
        <h2 class="stat-value">30</h2>
      </div>
      <hr class="divider">
      <div class="stat-group">
        <span class="stat-label">F2 Seat open slots every year</span>
        <h3 class="stat-value highlight">10-12</h3>
      </div>
    </article>

    <!-- Card 2 -->

      </div>
      <hr class="divider">
      <div class="stat-group">
        <span class="stat-label">F2 Seat open slots every year</span>
        <h3 class="stat-value highlight">10-12</h3>
      </div>
    </article>

    <!-- Card 3 -->

      <div class="card-header">
        <span class="badge">F2 Championship</span>
      </div>

      </div>

      <div class="stat-group">
        <span class="stat-label">F2 Seat open slots every year</span>
        <h3 class="stat-value highlight">10-12</h3>
      </div>
    </article>

  </main>

</body>
</html>
